<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>HaxFlash — Tournament Manager</title>
<style>
:root{--bg:#090d12;--panel:#111820;--panel2:#17212b;--line:#263441;--text:#eef5f8;--muted:#91a3b2;--green:#54f58b;--green2:#19b85b;--red:#ff6577;--gold:#ffd166}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 10% 0%,#143023 0,transparent 35%),var(--bg);color:var(--text);font:14px/1.5 Inter,system-ui,Segoe UI,Arial,sans-serif}button,input,select{font:inherit}button{cursor:pointer;border:1px solid var(--line);background:#1b2732;color:var(--text);padding:9px 13px;border-radius:9px;font-weight:700;transition:.15s}button:hover{border-color:var(--green);transform:translateY(-1px)}button.primary{background:var(--green);color:#06120a;border-color:var(--green)}button.ghost{background:transparent}button.danger{color:var(--red)}input,select{background:#0b1117;border:1px solid var(--line);border-radius:8px;padding:10px;color:var(--text);width:100%;outline:none}input:focus,select:focus{border-color:var(--green)}label{display:block;color:var(--muted);font-size:12px;margin-bottom:5px}h1,h2,h3,p{margin:0}h1{font-size:27px;letter-spacing:-.8px}h2{font-size:18px}h3{font-size:14px}.muted{color:var(--muted)}.small{font-size:12px}.app{min-height:100vh}.topbar{height:68px;border-bottom:1px solid #23313b;background:#090e13e8;display:flex;align-items:center;justify-content:space-between;padding:0 24px;position:sticky;top:0;z-index:5;backdrop-filter:blur(12px)}.brand{display:flex;align-items:center;gap:10px;font-weight:950;font-size:21px;letter-spacing:1px}.brand-mark{width:32px;height:32px;border-radius:9px;background:var(--green);color:#08120b;display:grid;place-items:center;font-weight:1000;font-style:italic}.brand span{color:var(--green)}.top-actions{display:flex;gap:8px}.layout{display:grid;grid-template-columns:230px minmax(0,1fr);min-height:calc(100vh - 68px)}aside{border-right:1px solid #23313b;padding:22px 14px;background:#0b1117}.nav-title{font-size:10px;color:#607281;letter-spacing:1.6px;font-weight:800;margin:12px 10px}.nav{display:flex;flex-direction:column;gap:5px}.nav button{background:transparent;border-color:transparent;text-align:left;color:#9db0bd;padding:11px 12px}.nav button.active{background:#183126;color:var(--green);border-color:#254a36}.nav button span{margin-right:10px}.aside-bottom{margin-top:32px;padding:12px;border:1px solid var(--line);border-radius:12px;color:var(--muted);font-size:12px}.main{padding:28px;max-width:1600px;width:100%;margin:auto}.heading{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:22px}.heading p{color:var(--muted);margin-top:5px}.cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin-bottom:22px}.stat,.panel,.tournament-card{background:linear-gradient(140deg,#141e27,#10171e);border:1px solid var(--line);border-radius:15px;padding:17px}.stat .num{font-size:25px;font-weight:900;margin-top:8px}.stat .label{color:var(--muted);font-size:12px}.panel{margin-bottom:16px}.panel-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:15px}.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px}.field{min-width:0}.wide{grid-column:1/-1}.row{display:flex;align-items:center;gap:9px;flex-wrap:wrap}.divider{height:1px;background:var(--line);margin:15px 0}.empty{padding:42px 18px;text-align:center;border:1px dashed #344654;border-radius:14px;color:var(--muted)}.empty .emoji{font-size:36px;margin-bottom:8px}.tournament-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:13px}.tournament-card{cursor:pointer}.tournament-card:hover{border-color:#4a7b5c}.tournament-card h3{margin:12px 0 4px}.tournament-card .meta{font-size:12px;color:var(--muted)}.badge{display:inline-flex;background:#203a2b;color:var(--green);font-size:10px;font-weight:900;padding:4px 7px;border-radius:6px;letter-spacing:.5px}.club-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px}.club{border:1px solid var(--line);background:#0d141b;border-radius:12px;padding:13px;display:flex;gap:12px;align-items:center}.crest{width:48px;height:48px;object-fit:contain;background:#19242d;border-radius:10px;padding:5px}.crest-fallback{display:grid;place-items:center;font-size:22px;color:var(--green)}.club-name{font-weight:800;overflow-wrap:anywhere}.club-actions{margin-left:auto}.comp-layout{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:16px;align-items:start}.match-list{display:flex;flex-direction:column;gap:9px}.match{display:grid;grid-template-columns:55px minmax(0,1fr) 100px;gap:10px;align-items:center;background:#0c1319;border:1px solid var(--line);border-radius:10px;padding:10px}.match:hover{border-color:#486353}.match-date{color:var(--muted);font-size:11px}.match-teams{font-weight:750}.match-score{font-weight:900;color:var(--green);text-align:right}.zone-tabs{display:flex;gap:7px;margin-bottom:12px}.zone-tabs button.selected{background:var(--green);color:#08120b;border-color:var(--green)}table{border-collapse:collapse;width:100%;font-size:13px}th,td{padding:10px 8px;border-bottom:1px solid #25323c;text-align:center}th{font-size:10px;letter-spacing:.8px;color:var(--muted)}td:first-child,th:first-child{text-align:left}td.team{font-weight:750}.pos{color:var(--muted);width:25px}.score-inputs{display:flex;gap:8px;align-items:center}.score-inputs input{width:68px;text-align:center;font-size:20px;font-weight:900}.modal-back{position:fixed;inset:0;background:#000b;z-index:10;display:none;align-items:center;justify-content:center;padding:15px}.modal-back.open{display:flex}.modal{width:min(650px,100%);max-height:90vh;overflow:auto;background:#111a22;border:1px solid #354653;border-radius:16px;padding:22px;box-shadow:0 25px 100px #000a}.modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}.close{font-size:20px;padding:4px 10px}.file{font-size:12px;padding:8px}.color-input{height:40px;padding:3px}.bracket{display:flex;gap:18px;overflow:auto;padding:12px 0}.round{min-width:180px;display:flex;flex-direction:column;justify-content:space-around;gap:14px}.bracket-match{border:1px solid var(--line);background:#0b1218;border-radius:9px;padding:9px;font-size:12px}.bracket-match div{padding:4px 0}.bracket-match .winner{color:var(--green);font-weight:900}.draw-stage{min-height:210px;background:radial-gradient(circle at center,#1b3a2a,#0b1218 70%);border:1px solid #284536;border-radius:14px;display:grid;place-items:center;text-align:center;padding:20px}.draw-stage img{width:68px;height:68px;object-fit:contain}.draw-name{font-size:24px;font-weight:950;margin-top:10px}.overlay-preview{background:#090e14;border:1px solid #293a46;border-radius:12px;padding:18px;text-align:center}.overlay-versus{display:flex;align-items:center;justify-content:space-around;gap:15px}.overlay-team{width:42%;font-weight:900}.overlay-team img{width:64px;height:64px;object-fit:contain;display:block;margin:0 auto 8px}.versus{font-size:24px;font-weight:1000;color:var(--green)}.score-big{font-size:32px;font-weight:1000;color:var(--green);margin-top:8px}.toast{position:fixed;bottom:20px;right:20px;background:#173b28;border:1px solid #3c8054;color:#dfffea;padding:12px 17px;border-radius:10px;z-index:20;display:none}.hidden{display:none!important}@media(max-width:900px){.layout{grid-template-columns:1fr}aside{border-right:0;border-bottom:1px solid var(--line);padding:10px;position:sticky;top:68px;z-index:4}.nav-title,.aside-bottom{display:none}.nav{flex-direction:row;overflow:auto}.nav button{white-space:nowrap;padding:9px}.main{padding:18px}.comp-layout{grid-template-columns:1fr}.cards{grid-template-columns:1fr 1fr}}@media(max-width:550px){.topbar{padding:0 12px}.brand{font-size:17px}.top-actions button{padding:8px}.main{padding:13px}.heading{flex-direction:column}.form-grid{grid-template-columns:1fr}.wide{grid-column:auto}.cards{grid-template-columns:1fr 1fr}.match{grid-template-columns:42px minmax(0,1fr) 70px;padding:8px}.match-score{font-size:12px}}
</style>
</head>
<body>
<div class="app">
<header class="topbar"><div class="brand"><div class="brand-mark">H</div>HAX<span>FLASH</span></div><div class="top-actions"><button class="ghost" id="exportAll">⇩ Respaldo</button><button class="primary" id="newTop">＋ Torneo</button></div></header>
<div class="layout">
<aside><div class="nav-title">ESPACIO DE TRABAJO</div><div class="nav">
<button class="active" data-page="home"><span>▦</span>Inicio</button><button data-page="clubs"><span>♜</span>Clubes</button><button data-page="competition"><span>🏆</span>Competición</button><button data-page="overlays"><span>▣</span>Overlays</button>
</div><div class="aside-bottom">Tus torneos se guardan en este navegador. No se envían a ningún servidor.</div></aside>
<main class="main" id="main"></main>
</div></div>
<div class="modal-back" id="modalBack"><div class="modal"><div class="modal-head"><h2 id="modalTitle">Ventana</h2><button class="close" id="closeModal">×</button></div><div id="modalBody"></div></div></div><div class="toast" id="toast"></div>
<script>
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const uid=()=>Math.random().toString(36).slice(2,10);
let state={tournaments:[],active:null,page:"home",zone:"A",drawIndex:0,drawOrder:[]};
try{const saved=localStorage.getItem("haxflash-v1");if(saved)state={...state,...JSON.parse(saved)}}catch(e){}
function persist(){localStorage.setItem("haxflash-v1",JSON.stringify(state))}
function active(){return state.tournaments.find(t=>t.id===state.active)}
function toast(s){let el=$("#toast");el.textContent=s;el.style.display="block";setTimeout(()=>el.style.display="none",2300)}
function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function fileData(file){return new Promise((res,rej)=>{let r=new FileReader();r.onload=()=>res(r.result);r.onerror=rej;r.readAsDataURL(file)})}
function openModal(title,html){$("#modalTitle").textContent=title;$("#modalBody").innerHTML=html;$("#modalBack").classList.add("open")}
function closeModal(){$("#modalBack").classList.remove("open")}
$("#closeModal").onclick=closeModal;$("#modalBack").addEventListener("click",e=>{if(e.target===$("#modalBack"))closeModal()});
function nav(page){state.page=page;$$(".nav button").forEach(b=>b.classList.toggle("active",b.dataset.page===page));render()}
$$(".nav button").forEach(b=>b.onclick=()=>nav(b.dataset.page));
$("#newTop").onclick=()=>newTournament();
$("#exportAll").onclick=()=>download("haxflash-respaldo.json",JSON.stringify(state,null,2),"application/json");
function download(name,content,type="text/plain"){let a=document.createElement("a"),u=URL.createObjectURL(new Blob([content],{type}));a.href=u;a.download=name;a.click();URL.revokeObjectURL(u)}
function logoHTML(club,size=48){return club.logo?`<img class="crest" style="width:${size}px;height:${size}px" src="${club.logo}" alt="">`:`<div class="crest crest-fallback" style="width:${size}px;height:${size}px">♜</div>`}
function newTournament(){openModal("Crear torneo",`<form id="createForm" class="form-grid">
<div class="field wide"><label>Nombre del torneo</label><input name="name" required placeholder="Ej. Copa HaxFlash 2026"></div>
<div class="field"><label>Modalidad</label><select name="mode"><option value="Liga">Liga</option><option value="Copa">Copa</option></select></div>
<div class="field"><label>Cantidad de clubes</label><select name="count">${[4,6,8,10,12,16,20,24,32].map(n=>`<option>${n}</option>`).join("")}<option value="custom">Personalizada</option></select></div>
<div class="field"><label>Formato</label><select name="format" id="formatSelect"><option value="round">Liga todos contra todos</option><option value="zones">Liga dividida (Zona A/B)</option></select></div>
<div class="field"><label>Logo del torneo (opcional)</label><input name="logo" type="file" accept="image/*"></div>
<div class="field wide"><button class="primary" type="submit">Crear torneo →</button></div></form>`);
const mode=$('#createForm [name=mode]'),fmt=$('#formatSelect');mode.onchange=()=>{fmt.innerHTML=mode.value==="Liga"?'<option value="round">Liga todos contra todos</option><option value="zones">Liga dividida (Zona A/B)</option>':'<option value="single">Copa Única · partido único</option><option value="homeaway">Copa Global · ida y vuelta</option>'};mode.onchange();
$('#createForm [name=count]').onchange=e=>{if(e.target.value==="custom"){e.target.outerHTML='<input name="count" type="number" min="2" max="64" value="8" required>'}};
$("#createForm").onsubmit=async e=>{e.preventDefault();let f=e.target,logo=f.logo.files[0]?await fileData(f.logo.files[0]):"";let t={id:uid(),name:f.name.value.trim(),mode:f.mode.value,format:f.format.value,count:+f.count.value,logo,clubs:[],matches:[],created:Date.now(),drawn:false};state.tournaments.unshift(t);state.active=t.id;state.page="clubs";persist();closeModal();render();toast("Torneo creado. Añadí los clubes.")}}
function render(){let t=active();if(state.page!=="home"&&!t){state.page="home";$$(".nav button").forEach(b=>b.classList.toggle("active",b.dataset.page==="home"))}
if(state.page==="home")renderHome();else if(state.page==="clubs")renderClubs();else if(state.page==="competition")renderCompetition();else renderOverlays()}
function renderHome(){let total=state.tournaments.length,clubs=state.tournaments.reduce((a,t)=>a+t.clubs.length,0),played=state.tournaments.reduce((a,t)=>a+t.matches.filter(m=>m.done).length,0);
$("#main").innerHTML=`<div class="heading"><div><h1>Tu centro de torneos</h1><p>Creá, organizá y transmití competiciones de Haxball.</p></div><button class="primary" id="createHome">＋ Crear torneo</button></div>
<div class="cards"><div class="stat"><div class="label">TORNEOS CREADOS</div><div class="num">${total}</div></div><div class="stat"><div class="label">CLUBES REGISTRADOS</div><div class="num">${clubs}</div></div><div class="stat"><div class="label">PARTIDOS FINALIZADOS</div><div class="num">${played}</div></div></div>
<div class="panel"><div class="panel-head"><h2>Mis torneos</h2><span class="muted small">Guardado local</span></div><div id="tournamentList"></div></div>`;
$("#createHome").onclick=newTournament;let list=$("#tournamentList");if(!total){list.innerHTML=`<div class="empty"><div class="emoji">🏆</div><h2>Tu próximo torneo empieza acá</h2><p>Creá una liga o copa, agregá clubes y gestioná los partidos.</p><button class="primary" style="margin-top:14px" id="firstCreate">Crear mi primer torneo</button></div>`;$("#firstCreate").onclick=newTournament}else{list.innerHTML=`<div class="tournament-grid">${state.tournaments.map(t=>`<div class="tournament-card" data-id="${t.id}"><span class="badge">${esc(t.mode.toUpperCase())}</span><h3>${esc(t.name)}</h3><div class="meta">${t.clubs.length}/${t.count} clubes · ${t.matches.filter(m=>m.done).length} partidos jugados</div><div class="row" style="margin-top:13px"><button data-open="${t.id}" class="primary">Abrir</button><button data-delete="${t.id}" class="danger">Eliminar</button></div></div>`).join("")}</div>`;$$("[data-open]").forEach(b=>b.onclick=()=>{state.active=b.dataset.open;state.page="clubs";persist();nav("clubs")});$$("[data-delete]").forEach(b=>b.onclick=()=>{if(confirm("¿Eliminar este torneo y sus datos locales?")){state.tournaments=state.tournaments.filter(t=>t.id!==b.dataset.delete);if(state.active===b.dataset.delete)state.active=null;persist();render()}})}}
function renderClubs(){let t=active();$("#main").innerHTML=`<div class="heading"><div><h1>${esc(t.name)}</h1><p>Administrá los equipos, escudos e identidad visual.</p></div><div class="row"><button id="goComp">Competición →</button><button class="primary" id="addClub">＋ Añadir club</button></div></div>
<div class="cards"><div class="stat"><div class="label">MODALIDAD</div><div class="num">${esc(t.mode)}</div></div><div class="stat"><div class="label">CLUBES</div><div class="num">${t.clubs.length} / ${t.count}</div></div><div class="stat"><div class="label">FORMATO</div><div class="num" style="font-size:17px">${formatName(t)}</div></div></div>
<div class="panel"><div class="panel-head"><h2>Clubes participantes</h2><span class="muted small">Los overlays se crean desde cada club</span></div><div id="clubList"></div></div>
<div class="panel"><div class="panel-head"><h2>Configuración del torneo</h2><button id="editTournament">Editar</button></div><p class="muted">${t.drawn?"El sorteo ya está realizado. Podés modificar los resultados desde Competición.":"Cuando completes los clubes, realizá el sorteo para crear el calendario o cuadro."}</p><div class="row" style="margin-top:12px"><button class="primary" id="drawOne">Sortear de a uno</button><button id="drawNow">Sortear inmediatamente</button></div><div id="drawReveal" style="margin-top:14px"></div></div>`;
$("#addClub").onclick=()=>clubModal();$("#goComp").onclick=()=>nav("competition");$("#drawOne").onclick=()=>draw(true);$("#drawNow").onclick=()=>draw(false);$("#editTournament").onclick=()=>editTournament(t);
let list=$("#clubList");if(!t.clubs.length)list.innerHTML=`<div class="empty"><div class="emoji">♜</div><h3>Aún no hay clubes</h3><p>Agregá los participantes para comenzar.</p><button class="primary" style="margin-top:12px" id="addFirst">Añadir club</button></div>`;else list.innerHTML=`<div class="club-grid">${t.clubs.map(c=>`<div class="club">${logoHTML(c)}<div><div class="club-name">${esc(c.name)}</div><div class="muted small">${c.colors?.join(" · ")||"Colores sin configurar"}</div><div class="row" style="margin-top:6px"><button data-editclub="${c.id}">Editar</button><button data-overlayclub="${c.id}">Overlay</button></div></div></div>`).join("")}</div>`;
$("#addFirst")?.addEventListener("click",()=>clubModal());$$("[data-editclub]").forEach(b=>b.onclick=()=>clubModal(t.clubs.find(c=>c.id===b.dataset.editclub)));$$("[data-overlayclub]").forEach(b=>b.onclick=()=>clubOverlay(t.clubs.find(c=>c.id===b.dataset.overlayclub)))}
function formatName(t){return t.format==="round"?"Todos contra todos":t.format==="zones"?"Zonas A/B":t.format==="single"?"Copa Única":"Copa Global · Ida y vuelta"}
function editTournament(t){openModal("Editar torneo",`<form id="editT" class="form-grid"><div class="field wide"><label>Nombre</label><input name="name" value="${esc(t.name)}" required></div><div class="field"><label>Clubes previstos</label><input name="count" type="number" min="2" max="64" value="${t.count}" required></div><div class="field"><label>Formato</label><input value="${formatName(t)}" disabled></div><div class="wide"><button class="primary">Guardar cambios</button></div></form>`);$("#editT").onsubmit=e=>{e.preventDefault();t.name=e.target.name.value.trim();t.count=+e.target.count.value;persist();closeModal();render()}}
function clubModal(c=null){let t=active();openModal(c?"Editar club":"Añadir club",`<form id="clubForm" class="form-grid"><div class="field wide"><label>Nombre del club</label><input name="name" required value="${esc(c?.name||"")}" placeholder="Ej. HAXBALL FC"></div><div class="field wide"><label>Escudo del club</label><input type="file" name="logo" accept="image/*" class="file"><span class="muted small">Subí PNG, JPG o WebP.</span></div><div class="field"><label>Paleta</label><select name="palette"><option value="1">Color único</option><option value="2">Color doble</option><option value="3">Color triple</option></select></div><div class="field"><label>Diseño</label><select name="design"><option>Liso</option><option>Diagonal</option><option>Franjas</option><option>Geométrico</option></select></div><div class="field"><label>Color 1</label><input type="color" name="c1" class="color-input" value="${c?.colors?.[0]||"#54F58B"}"></div><div class="field"><label>Color 2</label><input type="color" name="c2" class="color-input" value="${c?.colors?.[1]||"#173BFF"}"></div><div class="field"><label>Color 3</label><input type="color" name="c3" class="color-input" value="${c?.colors?.[2]||"#F4F4F5"}"></div><div class="field"><label>Tratamiento</label><select name="gradient"><option value="yes">Degradado</option><option value="no">Color sólido</option></select></div><div class="field wide"><button class="primary">Guardar club y generar identidad</button></div></form>`);
let form=$("#clubForm");form.palette.value=String(c?.colors?.length||1);form.design.value=c?.design||"Liso";form.gradient.value=c?.gradient===false?"no":"yes";form.onsubmit=async e=>{e.preventDefault();let f=e.target,logo=f.logo.files[0]?await fileData(f.logo.files[0]):c?.logo||"",n=+f.palette.value,colors=[f.c1.value,f.c2.value,f.c3.value].slice(0,n);let item={id:c?.id||uid(),name:f.name.value.trim(),logo,colors,design:f.design.value,gradient:f.gradient.value==="yes"};if(c)Object.assign(c,item);else{if(t.clubs.length>=t.count){toast("Ya alcanzaste la cantidad prevista de clubes.");return}t.clubs.push(item)}persist();closeModal();render();toast("Club guardado")}}
function clubOverlay(c){openModal("Overlay de club · "+c.name,`<div class="overlay-preview" id="clubPreview"><div style="height:8px;border-radius:6px;background:${c.gradient?`linear-gradient(90deg,${c.colors.join(",")})`:c.colors[0]};margin-bottom:16px"></div><div class="overlay-versus"><div class="overlay-team">${c.logo?`<img src="${c.logo}">`:'<div style="font-size:48px">♜</div>'}<div style="font-size:22px;letter-spacing:2px">${esc(c.name.toUpperCase())}</div></div></div><div class="muted small" style="margin-top:10px">HAXFLASH · CLUB OVERLAY</div></div><div class="row" style="margin-top:14px"><button class="primary" id="downloadClub">Guardar overlay PNG</button></div>`);$("#downloadClub").onclick=()=>{makeOverlay(c,null,"club")}}
function draw(reveal){let t=active();if(t.clubs.length<2){toast("Necesitás al menos 2 clubes para sortear.");return}if(t.drawn){toast("El sorteo ya está realizado.");return}
let clubs=[...t.clubs].sort(()=>Math.random()-.5);state.drawOrder=clubs.map(c=>c.id);state.drawIndex=0;
if(reveal){showRevealStep()}else{generateMatches(t,clubs);t.drawn=true;persist();render();toast("Sorteo realizado")}
}
function showRevealStep(){let t=active(),el=$("#drawReveal");if(!el)return;let c=t.clubs.find(c=>c.id===state.drawOrder[state.drawIndex]);if(!c){generateMatches(t,state.drawOrder.map(id=>t.clubs.find(c=>c.id===id)));t.drawn=true;persist();render();toast("Sorteo completo");return}
el.innerHTML=`<div class="draw-stage">${logoHTML(c,68)}<div class="draw-name">${esc(c.name)}</div><div class="muted">Club ${state.drawIndex+1} de ${state.drawOrder.length}</div><button class="primary" id="nextReveal" style="margin-top:14px">${state.drawIndex===state.drawOrder.length-1?"Finalizar sorteo":"Revelar siguiente →"}</button></div>`;$("#nextReveal").onclick=()=>{state.drawIndex++;showRevealStep()}}
function generateMatches(t,clubs){t.matches=[];if(t.mode==="Liga"&&t.format==="zones"){let mid=Math.ceil(clubs.length/2);clubs.forEach((c,i)=>c.zone=i<mid?"A":"B");["A","B"].forEach(z=>makeRoundMatches(t,clubs.filter(c=>c.zone===z),z))}else if(t.mode==="Liga"){clubs.forEach(c=>c.zone="");makeRoundMatches(t,clubs,"")}else{clubs.forEach(c=>c.zone="");let arr=[...clubs];while(arr.length>1){let a=arr.shift(),b=arr.pop();t.matches.push({id:uid(),a:a.id,b:b.id,stage:"Primera ronda",leg:1,done:false,scoreA:null,scoreB:null});if(t.format==="homeaway")t.matches.push({id:uid(),a:b.id,b:a.id,stage:"Primera ronda",leg:2,done:false,scoreA:null,scoreB:null})}t.bracket=arr.length?arr.map(c=>c.id):[];t.rounds=1;t.drawn=true}}
function makeRoundMatches(t,clubs,zone){let arr=[...clubs];if(arr.length%2)arr.push(null);let n=arr.length,rounds=n-1;for(let r=0;r<rounds;r++){for(let i=0;i<n/2;i++){let a=arr[i],b=arr[n-1-i];if(a&&b)t.matches.push({id:uid(),a:a.id,b:b.id,stage:`Fecha ${r+1}`,date:r+1,zone,done:false,scoreA:null,scoreB:null})}arr.splice(1,0,arr.pop())}}
function renderCompetition(){let t=active();if(!t.drawn){$("#main").innerHTML=`<div class="heading"><div><h1>Competición</h1><p>El sorteo todavía no está realizado.</p></div><button class="primary" id="goClubs">Ir a clubes →</button></div><div class="empty"><div class="emoji">🎲</div><h2>Prepará el sorteo</h2><p>Agregá clubes y generá el calendario o cuadro de la competición.</p></div>`;$("#goClubs").onclick=()=>nav("clubs");return}
let isLeague=t.mode==="Liga";$("#main").innerHTML=`<div class="heading"><div><h1>${esc(t.name)}</h1><p>${formatName(t)} · ${t.clubs.length} clubes</p></div><div class="row"><button id="goClubPage">Clubes</button><button class="primary" id="exportT">Exportar torneo</button></div></div><div class="comp-layout"><section><div class="panel"><div class="panel-head"><h2>${isLeague?"Tabla de posiciones":"Cuadro de copa"}</h2>${isLeague&&t.format==="zones"?`<div class="zone-tabs"><button data-zone="A" class="${state.zone==="A"?"selected":""}">ZONA A</button><button data-zone="B" class="${state.zone==="B"?"selected":""}">ZONA B</button></div>`:""}</div>${isLeague?tableHTML(t):bracketHTML(t)}</div></section><aside style="position:static;border:0;background:none;padding:0"><div class="panel"><div class="panel-head"><h2>Partidos</h2><span class="badge">${t.matches.filter(m=>m.done).length}/${t.matches.length}</span></div><div class="match-list">${t.matches.map(m=>matchHTML(t,m)).join("")||'<div class="empty">No hay partidos.</div>'}</div></div></aside></div>`;
$$("[data-zone]").forEach(b=>b.onclick=()=>{state.zone=b.dataset.zone;renderCompetition()});$$("[data-match]").forEach(b=>b.onclick=()=>scoreModal(t,t.matches.find(m=>m.id===b.dataset.match)));$("#goClubPage").onclick=()=>nav("clubs");$("#exportT").onclick=()=>download(`${t.name.replace(/\W+/g,"-")}.json`,JSON.stringify(t,null,2),"application/json")}
function tableHTML(t){let clubs=t.clubs.filter(c=>t.format!=="zones"||c.zone===state.zone);let stats=clubs.map(c=>({c,pj:0,g:0,e:0,p:0,gf:0,gc:0,pts:0}));let by=Object.fromEntries(stats.map(s=>[s.c.id,s]));t.matches.filter(m=>m.done&&by[m.a]&&by[m.b]).forEach(m=>{let a=by[m.a],b=by[m.b];a.pj++;b.pj++;a.gf+=m.scoreA;a.gc+=m.scoreB;b.gf+=m.scoreB;b.gc+=m.scoreA;if(m.scoreA>m.scoreB){a.g++;b.p++;a.pts+=3}else if(m.scoreA<m.scoreB){b.g++;a.p++;b.pts+=3}else{a.e++;b.e++;a.pts++;b.pts++}});stats.sort((a,b)=>b.pts-a.pts||(b.gf-b.gc)-(a.gf-a.gc)||b.gf-a.gf);
return `<div style="overflow:auto"><table><thead><tr><th># Club</th><th>PJ</th><th>G</th><th>E</th><th>P</th><th>GF</th><th>GC</th><th>DG</th><th>PTS</th></tr></thead><tbody>${stats.map((s,i)=>`<tr><td class="team"><span class="pos">${i+1}</span> ${esc(s.c.name)}</td><td>${s.pj}</td><td>${s.g}</td><td>${s.e}</td><td>${s.p}</td><td>${s.gf}</td><td>${s.gc}</td><td>${s.gf-s.gc}</td><td style="color:var(--green);font-weight:900">${s.pts}</td></tr>`).join("")}</tbody></table></div>`}
function matchHTML(t,m){let a=t.clubs.find(c=>c.id===m.a),b=t.clubs.find(c=>c.id===m.b);return `<button class="match" data-match="${m.id}" style="text-align:left"><div class="match-date">${esc(m.stage||"Partido")}<br>${m.leg?`IDA/VTA ${m.leg}`:""}</div><div class="match-teams">${esc(a?.name||"TBD")}<br>${esc(b?.name||"TBD")}</div><div class="match-score">${m.done?`${m.scoreA} — ${m.scoreB}`:"VS"}</div></button>`}
function bracketHTML(t){let stages=[...new Set(t.matches.map(m=>m.stage))];if(!stages.length)return'<div class="empty">El cuadro se completa con el sorteo.</div>';return `<div class="bracket">${stages.map(stage=>`<div class="round"><h3>${esc(stage)}</h3>${t.matches.filter(m=>m.stage===stage).map(m=>{let a=t.clubs.find(c=>c.id===m.a),b=t.clubs.find(c=>c.id===m.b);return `<div class="bracket-match" data-match="${m.id}"><div class="${m.done&&m.scoreA>m.scoreB?"winner":""}">${esc(a?.name||"Por definir")} ${m.done?m.scoreA:""}</div><div class="${m.done&&m.scoreB>m.scoreA?"winner":""}">${esc(b?.name||"Por definir")} ${m.done?m.scoreB:""}</div><button data-match="${m.id}" style="margin-top:5px;padding:4px 7px">Editar</button></div>`}).join("")}</div>`).join("")}</div>`}
function scoreModal(t,m){let a=t.clubs.find(c=>c.id===m.a),b=t.clubs.find(c=>c.id===m.b);openModal("Editar resultado",`<p class="muted" style="margin-bottom:14px">${esc(m.stage||"Partido")} · ${esc(a?.name||"TBD")} vs ${esc(b?.name||"TBD")}</p><form id="scoreForm"><div class="score-inputs" style="justify-content:center;margin:18px 0"><input name="a" type="number" min="0" max="99" value="${m.scoreA??0}" required><span style="font-weight:900">—</span><input name="b" type="number" min="0" max="99" value="${m.scoreB??0}" required></div><div class="row"><button class="primary">Guardar resultado</button><button type="button" id="preOverlay">Overlay previa</button><button type="button" id="finalOverlay">Overlay final</button><button type="button" class="danger" id="clearScore">Borrar resultado</button></div></form>`);$("#scoreForm").onsubmit=e=>{e.preventDefault();m.scoreA=+e.target.a.value;m.scoreB=+e.target.b.value;m.done=true;persist();closeModal();renderCompetition();toast("Resultado guardado")};$("#clearScore").onclick=()=>{m.done=false;m.scoreA=m.scoreB=null;persist();closeModal();renderCompetition()};$("#preOverlay").onclick=()=>matchOverlay(t,m,false);$("#finalOverlay").onclick=()=>matchOverlay(t,m,true)}
function matchOverlay(t,m,final){let a=t.clubs.find(c=>c.id===m.a),b=t.clubs.find(c=>c.id===m.b);openModal(final?"Overlay · Resultado final":"Overlay · Previa",`<div id="matchPreview" class="overlay-preview"><div style="color:var(--green);font-weight:900;letter-spacing:3px;font-size:12px;margin-bottom:18px">${esc(t.name.toUpperCase())}</div><div class="overlay-versus"><div class="overlay-team">${a?.logo?`<img src="${a.logo}">`:'<div style="font-size:42px">♜</div>'}${esc(a?.name||"CLUB A")}</div><div class="versus">${final?`${m.scoreA??0} : ${m.scoreB??0}`:"VS"}</div><div class="overlay-team">${b?.logo?`<img src="${b.logo}">`:'<div style="font-size:42px">♜</div>'}${esc(b?.name||"CLUB B")}</div></div><div style="height:7px;background:linear-gradient(90deg,${a?.colors?.[0]||"#54f58b"},${b?.colors?.[0]||"#173bff"});border-radius:5px;margin-top:20px"></div></div><div class="row" style="margin-top:14px"><button class="primary" id="saveMatchPng">Guardar overlay PNG</button></div>`);$("#saveMatchPng").onclick=()=>makeOverlay(a,b,final?"final": "pre",m)}
function makeOverlay(a,b,kind,m){let canvas=document.createElement("canvas");canvas.width=1280;canvas.height=500;let ctx=canvas.getContext("2d");ctx.fillStyle="#080e14";ctx.fillRect(0,0,1280,500);let grd=ctx.createLinearGradient(0,0,1280,500);grd.addColorStop(0,a?.colors?.[0]||"#54f58b");grd.addColorStop(1,b?.colors?.[0]||"#193bff");ctx.globalAlpha=.22;ctx.fillStyle=grd;ctx.fillRect(0,0,1280,500);ctx.globalAlpha=1;ctx.fillStyle="#54f58b";ctx.font="bold 26px Arial";ctx.textAlign="center";ctx.fillText(kind==="club"?"HAXFLASH · CLUB":kind==="final"?"RESULTADO FINAL":"HAXFLASH · MATCHDAY",640,65);
function drawLogo(c,x){if(c?.logo){let img=new Image();img.onload=()=>{ctx.drawImage(img,x-80,115,160,160);write();};img.src=c.logo}else{ctx.fillStyle="#1a2b36";ctx.beginPath();ctx.arc(x,195,75,0,Math.PI*2);ctx.fill();ctx.fillStyle="#54f58b";ctx.font="bold 70px Arial";ctx.fillText("♜",x,220);write()}}
let ready=0;function write(){ready++;if(ready<(kind==="club"?1:2))return;ctx.textAlign="center";ctx.fillStyle="#f2f7f9";ctx.font="bold 46px Arial";ctx.fillText((a?.name||"CLUB A").toUpperCase(),320,330);if(kind!=="club")ctx.fillText((b?.name||"CLUB B").toUpperCase(),960,330);ctx.fillStyle="#54f58b";ctx.font="bold 70px Arial";ctx.fillText(kind==="club"?"":kind==="final"?`${m?.scoreA??0}  —  ${m?.scoreB??0}`:"VS",640,230);ctx.fillStyle="#91a3b2";ctx.font="bold 18px Arial";ctx.fillText("HAXFLASH TOURNAMENT MANAGER",640,445);let link=document.createElement("a");link.download=`haxflash-${kind}-${(a?.name||"club").replace(/\W+/g,"-")}.png`;link.href=canvas.toDataURL("image/png");link.click()}
if(kind==="club"){drawLogo(a,640)}else{drawLogo(a,320);drawLogo(b,960)}}
function renderOverlays(){let t=active();$("#main").innerHTML=`<div class="heading"><div><h1>Centro de overlays</h1><p>Generá gráficos de clubes, previas y resultados para tus transmisiones.</p></div></div><div class="panel"><div class="panel-head"><h2>Clubes</h2></div>${t.clubs.length?`<div class="club-grid">${t.clubs.map(c=>`<div class="club">${logoHTML(c)}<div><div class="club-name">${esc(c.name)}</div><button data-clubov="${c.id}" style="margin-top:6px">Generar overlay</button></div></div>`).join("")}</div>`:'<div class="empty">Agregá clubes para crear overlays.</div>'}</div><div class="panel"><div class="panel-head"><h2>Overlays de partidos</h2></div>${t.matches.length?`<div class="match-list">${t.matches.map(m=>matchHTML(t,m)).join("")}</div>`:'<div class="empty">Realizá el sorteo para ver partidos.</div>'}</div>`;$$("[data-clubov]").forEach(b=>b.onclick=()=>clubOverlay(t.clubs.find(c=>c.id===b.dataset.clubov)));$$("[data-match]").forEach(b=>b.onclick=()=>scoreModal(t,t.matches.find(m=>m.id===b.dataset.match)))}
render();
</script>
</body></html>
